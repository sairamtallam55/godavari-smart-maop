<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0f2b38" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Sacred Godavari River Waves in Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />
  
  <!-- Large Map Pin Centerpiece -->
  <g transform="translate(256, 230) scale(1.1)">
    <!-- Pin Body -->
    <path d="M 0 -110 C -55 -110 -100 -65 -100 -10 C -100 55 0 135 0 135 C 0 135 100 55 100 -10 C 100 -65 55 -110 0 -110 Z" fill="#0d9488" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Inner River Wave inside Pin -->
    <circle cx="0" cy="-10" r="50" fill="#ffffff" />
    
    <!-- Flowing River Wave -->
    <path d="M -35 -15 C -20 -30 -10 -5 5 -20 C 18 -32 28 -15 35 -10 C 25 5 15 -10 0 5 C -15 20 -25 0 -35 -15 Z" fill="#0284c7" />
  </g>
  
  <!-- Sacred Pushkaralu Ripple Arcs -->
  <path d="M 120 400 Q 256 360 392 400" fill="none" stroke="url(#wave)" stroke-width="12" stroke-linecap="round" />
  <path d="M 150 430 Q 256 395 362 430" fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" opacity="0.7" />
</svg>
